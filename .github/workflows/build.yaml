name: CI

on:
  push:
    tags:
      - '*'
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: ✅ Format
      run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - uses: Swatinem/rust-cache@v2

    - name: 🔍 Lint
      run: cargo clippy --all-targets --all-features -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🛡️ Advisories, licenses, bans, sources
      uses: EmbarkStudios/cargo-deny-action@v2

  build:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - uses: Swatinem/rust-cache@v2

    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov

    - name: 🛠️ Build
      run: cargo build --locked --verbose

    - name: 🧪 Test with coverage
      run: |
          cargo llvm-cov --locked --lcov --output-path lcov.info --fail-under-lines "$MIN_LINE_COVERAGE"
          cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
      env:
        MIN_LINE_COVERAGE: 80

    - name: 📤 Coverage report
      uses: actions/upload-artifact@v4
      with:
        name: lcov
        path: lcov.info

  e2e-native:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - uses: Swatinem/rust-cache@v2

    - name: 📦 Install generic mina from packages.o1test.net
      # generic: network packages install config_<commit>.json, which the daemon
      # merges into every config (public peer list and fork point)
      run: |
          echo "deb [trusted=yes] https://packages.o1test.net noble stable" | sudo tee /etc/apt/sources.list.d/mina.list
          sudo apt-get update
          sudo apt-get install -y mina-devnet-generic
          mina version

    - name: 🧪 Native network produces blocks
      run: cargo test --locked --test e2e -- --ignored --nocapture native_small_network_produces_blocks
      env:
        MINIMINA_E2E_KEEP: ${{ runner.temp }}/e2e

    - name: 📤 Network directory on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-native
        path: ${{ runner.temp }}/e2e

  e2e-docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MINIMINA_E2E_IMAGE: minaprotocol/mina-daemon:4.0.1-1e9d141-bookworm-devnet-generic
    steps:
    - name: 🧹 Free disk for the daemon image
      run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

    - name: 📥 Checkout
      uses: actions/checkout@v4

    - uses: Swatinem/rust-cache@v2

    - name: 🐳 Pull daemon image
      run: docker pull "$MINIMINA_E2E_IMAGE"

    - name: 🧪 Docker network produces blocks
      run: cargo test --locked --test e2e -- --ignored --nocapture docker_small_network_produces_blocks
      env:
        MINIMINA_E2E_KEEP: ${{ runner.temp }}/e2e

    - name: 📤 Network directory and container logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-docker
        path: ${{ runner.temp }}/e2e

  package:
    needs: build
    runs-on: ubuntu-latest
    # oldest glibc of the supported codenames (bullseye, focal: 2.31); with rustls
    # the binary needs nothing else, so this one package serves all of them.
    # focal, not bullseye: the bullseye-security pool no longer serves its packages
    container: ubuntu:focal
    env:
      DEBIAN_FRONTEND: noninteractive
      # explicit: rustup refuses $HOME=/github/home while running as root
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
    steps:
    - name: 🧰 Build tools
      run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gcc libc6-dev make perl
          curl -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal --default-toolchain none
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

    - name: 📥 Checkout
      uses: actions/checkout@v4

    # prebuilt cargo-deb needs glibc 2.34; focal has 2.31
    - name: 🧰 cargo-deb
      run: cargo install cargo-deb --locked

    - name: 📦 Build package
      run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cargo build --release --locked
          scripts/deb-changelog.sh
          cargo deb --no-build

    - name: 🏷️ Tag matches Cargo.toml version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
          version=$(cargo pkgid | sed -E 's/.*[#@]//')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

    - uses: actions/upload-artifact@v4
      with:
        name: deb
        path: target/debian/*.deb

  package-test:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:bullseye, debian:bookworm, ubuntu:focal, ubuntu:jammy, ubuntu:noble]
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: deb

    - name: 🧪 Install and run
      run: |
          apt-get update
          apt-get install -y ./minimina_*.deb
          minimina --version
          MINIMINA_HOME=$(mktemp -d) minimina network list
          dpkg -L minimina

    - name: 🧹 Remove
      run: |
          apt-get remove -y minimina
          ! command -v minimina

  lintian:
    needs: package
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: deb

    - name: 🔍 Lintian
      run: |
          apt-get update
          apt-get install -y --no-install-recommends lintian
          lintian --fail-on error --info ./minimina_*.deb

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - fmt
      - clippy
      - deny
      - build
      - e2e-native
      - e2e-docker
      - package-test
      - lintian
    runs-on: ubuntu-latest
    environment: package

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: deb

    - name: 📤 Upload to every codename
      env:
        ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
        SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
        LANG: C.UTF-8
        LC_ALL: C.UTF-8
      run: |
          sudo apt-get update
          sudo apt-get install -y rubygems
          sudo gem install deb-s3
          for codename in bullseye bookworm focal jammy noble; do
            deb-s3 upload --s3-region=us-west-2 --bucket packages.o1test.net --lock --preserve-versions \
              --access-key-id="$ACCESS_KEY_ID" --secret-access-key="$SECRET_ACCESS_KEY" \
              --cache-control=max-age=120 --component stable --codename "$codename" ./minimina_*.deb
          done
