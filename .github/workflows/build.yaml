name: CI

on:
  push:
    tags:
      - '*'
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: ✅ Format
      run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - uses: Swatinem/rust-cache@v2

    - name: 🔍 Lint
      run: cargo clippy --all-targets --all-features -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🛡️ Advisories, licenses, bans, sources
      uses: EmbarkStudios/cargo-deny-action@v2

  build:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - uses: Swatinem/rust-cache@v2

    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov

    - name: 🛠️ Build
      run: cargo build --locked --verbose

    - name: 🧪 Test with coverage
      run: |
          cargo llvm-cov --locked --lcov --output-path lcov.info --fail-under-lines "$MIN_LINE_COVERAGE"
          cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
      env:
        MIN_LINE_COVERAGE: 80

    - name: 📤 Coverage report
      uses: actions/upload-artifact@v4
      with:
        name: lcov
        path: lcov.info

  e2e-native:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - uses: Swatinem/rust-cache@v2

    - name: 📦 Install generic mina from packages.o1test.net
      # generic: network packages install config_<commit>.json, which the daemon
      # merges into every config (public peer list and fork point)
      run: |
          echo "deb [trusted=yes] https://packages.o1test.net noble stable" | sudo tee /etc/apt/sources.list.d/mina.list
          sudo apt-get update
          sudo apt-get install -y mina-devnet-generic
          mina version

    - name: 🧪 Native network produces blocks
      run: cargo test --locked --test e2e -- --ignored --nocapture native_small_network_produces_blocks
      env:
        MINIMINA_E2E_KEEP: ${{ runner.temp }}/e2e

    - name: 📤 Network directory on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-native
        path: ${{ runner.temp }}/e2e

  e2e-docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MINIMINA_E2E_IMAGE: minaprotocol/mina-daemon:4.0.1-1e9d141-bookworm-devnet-generic
    steps:
    - name: 🧹 Free disk for the daemon image
      run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

    - name: 📥 Checkout
      uses: actions/checkout@v4

    - uses: Swatinem/rust-cache@v2

    - name: 🐳 Pull daemon image
      run: docker pull "$MINIMINA_E2E_IMAGE"

    - name: 🧪 Docker network produces blocks
      run: cargo test --locked --test e2e -- --ignored --nocapture docker_small_network_produces_blocks
      env:
        MINIMINA_E2E_KEEP: ${{ runner.temp }}/e2e

    - name: 📤 Network directory and container logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-docker
        path: ${{ runner.temp }}/e2e

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - fmt
      - clippy
      - deny
      - build
    runs-on: ubuntu-latest
    environment: package

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 📦 Package
      run: |
          cargo install cargo-deb
          cargo deb

    - name: 📤 Upload
      env:
        ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
        SECRET_ACCESS_KEY: ${{ secrets.SECRET_ACCESS_KEY }}
      run: |
          sudo apt-get update
          sudo apt-get install -y rubygems locales
          sudo gem install deb-s3

          sudo locale-gen en_US.UTF-8
          export LANG=en_US.UTF-8
          export LANGUAGE=en_US.UTF-8
          export LC_ALL=en_US.UTF-8
          deb-s3 upload --s3-region=us-west-2 --bucket packages.o1test.net --lock --preserve-versions --access-key-id=$ACCESS_KEY_ID --secret-access-key=$SECRET_ACCESS_KEY --cache-control=max-age=120 --component stable --codename noble ./target/debian/*.deb
