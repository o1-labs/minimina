# minimina network spec: `minimina network create --spec network.toml`
#
# minimina generates the keys, ports, peers and genesis ledger. Node names
# default to <role>-<n> (seed-1, bp-1, node-1, ...); client ports are
# assigned from 3100 in steps of 10 unless a node sets `client_port`.

# Build profile of the mina binaries: dev, devnet, lightnet, mainnet.
# --profile overrides it. Default: devnet.
profile = "devnet"

[[nodes]]
role = "seed"

[[nodes]]
role = "block-producer"
count = 2
balance = "11550000"          # default for block producers

[[nodes]]
role = "plain"                # follows the chain, produces no blocks

[[nodes]]
role = "archive"              # + mina-archive and a postgres database

[[nodes]]
role = "rosetta"              # mina-rosetta: reads the archive database and
# node = "node-1"             # the GraphQL API of this daemon (default: the archive node)

[[nodes]]
role = "archive-node-api"     # GraphQL over the archive database (events, actions)
# version = "2.0.0"           # npm package / docker image version
# bin = "/path/to/server"     # native mode: own executable instead of the npm install

# [[nodes]]
# role = "snark-coordinator"
# workers = 1
# fee = "0.001"

# Funded accounts for transactions in tests: account-1 .. account-N.
# Keys are in <network dir>/network-keypairs.
[ledger]
accounts = 3
balance = "1000"

# Docker mode images (defaults: the built-in 4.0.1 images).
# [docker]
# daemon_image = "minaprotocol/mina-daemon:..."
# archive_image = "minaprotocol/mina-archive:..."
# rosetta_image = "minaprotocol/mina-rosetta:..."
# archive_node_api_image = "ghcr.io/o1-labs/archive-node-api:..."

# Merged into the generated genesis runtime config.
# [runtime_config.genesis]
# slots_per_epoch = 480

# A fork to postfork binaries (native mode only). Needs genesis.k and
# proof.block_window_duration_ms in [runtime_config]; see the README.
# [hardfork]
# mode = "manual"                # or "auto" (--hardfork-handling migrate-exit)
# at = { slot = 42 }             # slot_chain_end, or a date: at = "2026-10-29T14:00:00Z"
# tx_end_before = 12             # default: k + 2
# genesis_slot_delta = 10
# method = "legacy"              # manual only: legacy | advanced
# [hardfork.postfork]
# bin_path = "/opt/mina-postfork/bin"
