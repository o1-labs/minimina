# minimina network spec: `minimina network create --spec network.toml`
#
# minimina generates the keys, ports, peers and genesis ledger. Node names
# default to <role>-<n> (seed-1, bp-1, node-1, ...); client ports are
# assigned from 3100 in steps of 10 unless a node sets `client_port`.

# Build profile of the mina binaries: dev, devnet, lightnet, mainnet.
# --profile overrides it. Default: devnet.
profile = "devnet"

# Log level of the mina processes (daemons, snark workers, mina-archive):
# Spam, Trace, Debug, Info, Warn, Error, Fatal. Default: daemons Info, and
# Trace to their mina.log.
# log_level = "Trace"

[[nodes]]
role = "seed"

[[nodes]]
role = "block-producer"
count = 2
balance = "11550000"          # default for block producers

[[nodes]]
role = "plain"                # follows the chain, produces no blocks

[[nodes]]
role = "archive"              # + mina-archive and a postgres database
# database = "archive"        # native mode: its name (default: minimina_<network id>)

[[nodes]]
role = "rosetta"              # mina-rosetta: reads the archive database and
# node = "node-1"             # the GraphQL API of this daemon (default: the archive node)

[[nodes]]
role = "archive-node-api"     # GraphQL over the archive database (events, actions)
# version = "2.0.0"           # npm package / docker image version
# bin = "/path/to/server"     # native mode: own executable instead of the npm install

# A whole network in one daemon: a seed that produces blocks and does its
# own snark work. A spec with only this node is a valid network.
# [[nodes]]
# role = "standalone"
# fee = "0.001"        # per snark work (default)
# An archive node next to it runs no daemon: its mina-archive (archive_port,
# default client port + 5) is fed by the standalone daemon.

# [[nodes]]
# role = "snark-coordinator"
# workers = 1
# fee = "0.001"
# balance = "1000"     # default; its fees go to this account

# Hands funded accounts out to tests (o1js Lightnet.acquireKeyPair); native
# mode only. Needs more than 10 accounts with a private key: best those of
# [ledger] file (with `sk`), else test accounts (two mina runs each, none
# with [keys] seed).
# [[nodes]]
# role = "accounts-manager"
# client_port = 8181
# keys = "key-pairs"           # key files of the file's accounts, by public key
# node = "bp-1"                # the daemon it asks (default: the first)

# Docker mode only: block producers submit their uptime to it (port 8080).
# [[nodes]]
# role = "uptime-service-backend"
# app_config = "uptime/app_config.json"    # relative to this file
# minasheets = "uptime/minasheets.json"    # Google Sheets credentials
# config_files = ["uptime/other.json"]     # other files the app config names

# Funded accounts for transactions in tests: account-1 .. account-N.
# Keys are in <network dir>/network-keypairs.
[ledger]
accounts = 3
balance = "1000"
# file = "accounts.csv"       # accounts to start with; the generated ones are added
#                             # .json: a runtime config ledger (ledger.accounts)
#                             # .csv: header line, then public_key,balance[,private_key,delegate]

# Every key from a seed and the node or account name: the same accounts and
# peer ids on every create (--key-seed replaces it). Without it, mina
# generates new keys on every create.
# [keys]
# seed = "my-network"

# Docker mode images (defaults: the built-in 4.0.1 images).
# [docker]
# daemon_image = "minaprotocol/mina-daemon:..."
# archive_image = "minaprotocol/mina-archive:..."
# rosetta_image = "minaprotocol/mina-rosetta:..."
# archive_node_api_image = "ghcr.io/o1-labs/archive-node-api:..."
# uptime_service_backend_image = "..."   # no default; needed for the uptime role

# Merged into the generated genesis runtime config.
# [runtime_config.genesis]
# slots_per_epoch = 480

# A fork to postfork binaries (native mode only). Needs genesis.k and
# proof.block_window_duration_ms in [runtime_config]; see the README.
# [hardfork]
# mode = "manual"                # or "auto" (--hardfork-handling migrate-exit)
# at = { slot = 42 }             # slot_chain_end, or a date: at = "2026-10-29T14:00:00Z"
# tx_end_before = 12             # default: k + 2
# genesis_slot_delta = 10
# method = "legacy"              # manual only: legacy | advanced
# [hardfork.postfork]
# bin_path = "/opt/mina-postfork/bin"
# archive_upgrade = "/opt/mina-postfork/upgrade.sql"   # default: the package's etc/mina/archive/upgrade.sql
