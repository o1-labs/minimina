[package]
name = "minimina"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "Spin up local Mina networks with docker compose or native processes"


[dependencies]
clap = { version = "4.4.6", features = ["derive"] }
dirs = "5.0.1"
log = { version = "0.4.20" }
env_logger = { version = "0.11.6" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "^1.0.109"
chrono = "0.4.31"
uzers = "0.11.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2.4.1"
nix = { version = "0.29", features = ["signal", "process", "fs"] }
serde_norway = "0.9"
anyhow = "1.0.103"
toml = "0.8"
thiserror = "2"
mina-sdk = "=0.4.0-rc.2"
mina-archive-sdk = "=2.0.0"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[package.metadata.deb]
maintainer = "Piotr Stachyra <piotr.stachyra@minaprotocol.com>"
copyright = "2023, Mina Foundation"
license-file = ["LICENSE", "0"]
extended-description = """\
Command line tool that creates, starts, stops and inspects local Mina \
blockchain networks from a topology and genesis ledger, either as docker \
compose services or as native mina processes on the host."""
# written by scripts/deb-changelog.sh before `cargo deb`
changelog = "target/debian-changelog"
section = "utils"
priority = "optional"
depends = "$auto"
# docker mode needs docker with the compose v2 plugin; native mode needs mina
# (and postgresql-client plus mina-archive for archive nodes)
suggests = "docker-compose-plugin | docker-compose-v2, postgresql-client"
assets = [
    ["target/release/minimina", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/minimina/README", "644"],
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
exit = "deny"
