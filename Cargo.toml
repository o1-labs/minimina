[package]
name = "minimina"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = """\
MiniMina is a command line tool aimed at providing the capability \
to spin up Mina networks locally on a user's computer."""


[dependencies]
clap = { version = "4.4.6", features = ["derive"] }
dirs = "5.0.1"
log = { version = "0.4.20" }
env_logger = { version = "0.11.6" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "^1.0.109"
chrono = "0.4.31"
uzers = "0.11.3"
reqwest = { version = "0.12", features = ["blocking"] }
url = "2.4.1"
nix = { version = "0.29", features = ["signal", "process", "fs"] }
serde_norway = "0.9"
anyhow = "1.0.103"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "Piotr Stachyra <piotr.stachyra@minaprotocol.com>"
copyright = "2023, Piotr Stachyra <piotr.stachyra@minaprotocol.com"
depends = "$auto"
assets = [
    ["target/release/minimina", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/minimina/README", "644"],
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
exit = "deny"
